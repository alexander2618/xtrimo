version: '3.8'

services:
  xtrimo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # API Key 为可选，取消注释下行以启用 AI 功能
        # - GEMINI_API_KEY=${GEMINI_API_KEY}
    image: xtrimo-discovery-assistant:latest
    container_name: xtrimo
    ports:
      - "3000:80"
    restart: unless-stopped
